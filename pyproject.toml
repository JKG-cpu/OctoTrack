[project]
name = "OctoTrack"
version = "0.1.0"
description = "An Async CLI Client for GitHub that can be used to track different things on GitHub per repository."
readme = "README.md"
authors = [
    { name = "JKG-cpu", email = "jkg66512@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "platformdirs>=4.10.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.scripts]
octotrack = "octotrack:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
