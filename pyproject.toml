[project]
name = "OctoTrack"
version = "0.1.1"
description = "An Async CLI Client for GitHub that can be used to track different things on GitHub per repository."
readme = "README.md"
authors = [
    { name = "JKG-cpu", email = "jkg66512@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.28.1",
    "platformdirs>=4.10.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.27.0",
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/JKG-cpu/OctoTrack"
Repository = "https://github.com/JKG-cpu/OctoTrack"
Issues = "https://github.com/JKG-cpu/OctoTrack/issues"

[project.scripts]
octotrack = "octotrack:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]
